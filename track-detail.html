<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles/default.css">
  <link rel="icon" type="image/svg+xml" href="assets/icons/smiling_flower_icon.svg">
  <link rel="alternate icon" href="assets/icons/smiling_flower_icon.svg">
  <title>NewLeaf</title>
  <script>
    (function() {
      var savedTheme = localStorage.getItem('newleaf-theme');
      var theme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <div data-include="components/header.html"></div>

  <main class="page-track-detail">
    <div class="track-detail-inner">
      <a
        class="track-detail-back"
        id="track-detail-back"
        href="explore-tracks.html"
        aria-label="Back to category"
      >
        <span class="track-detail-back-icon" aria-hidden="true"></span>
        Back
      </a>

      <div id="track-detail-missing" class="track-detail-missing" hidden>
        <h1 class="track-detail-missing-title">Track not found</h1>
        <p class="track-detail-missing-text">
          We couldn't find that track. Try choosing one from Explore Tracks.
        </p>
        <a class="track-detail-missing-link" href="explore-tracks.html">Explore Tracks</a>
      </div>

      <div id="track-detail-main" class="track-detail-main" hidden>
        <article class="track-detail-hero" aria-labelledby="track-detail-title">
          <div class="track-detail-hero-top">
            <div class="track-detail-hero-media">
              <img
                id="track-detail-hero-img"
                src=""
                alt=""
                width="873"
                height="353"
                decoding="async"
              >
            </div>
            <div class="track-detail-hero-aside">
              <div class="track-detail-author-block">
                <img
                  id="track-detail-author-avatar"
                  class="track-detail-author-avatar"
                  src=""
                  alt=""
                  width="60"
                  height="60"
                  decoding="async"
                >
                <div class="track-detail-author-meta">
                  <p id="track-detail-author-created" class="track-detail-author-created"></p>
                  <p id="track-detail-author-role" class="track-detail-author-role"></p>
                </div>
              </div>
              <p id="track-detail-author-bio" class="track-detail-author-bio"></p>
              <a class="track-detail-read-bio" id="track-detail-read-bio" href="#">Read Full Bio</a>
            </div>
            <div class="track-detail-hero-bar">
              <h1 id="track-detail-title" class="track-detail-hero-bar-title"></h1>
              <button
                type="button"
                class="track-detail-add-btn"
                data-track-add-btn
                aria-pressed="false"
              >
                <span class="track-detail-add-btn-inner">
                  <img
                    class="track-detail-add-icon"
                    data-track-add-icon
                    src="/assets/icons/plus_icon.svg"
                    alt=""
                    width="24"
                    height="24"
                    decoding="async"
                  >
                  <span class="track-detail-add-label" data-track-add-label>Add Track</span>
                </span>
              </button>
            </div>
          </div>
        </article>

        <div class="track-detail-columns">
          <div class="track-detail-desc-col">
            <h2 class="track-detail-section-label">Author’s Description</h2>
            <div id="track-detail-author-desc" class="track-detail-author-desc"></div>
            <button
              type="button"
              class="track-detail-add-btn track-detail-add-btn--inline"
              data-track-add-btn
              aria-pressed="false"
            >
              <span class="track-detail-add-btn-inner">
                <img
                  class="track-detail-add-icon"
                  data-track-add-icon
                  src="/assets/icons/plus_icon.svg"
                  alt=""
                  width="24"
                  height="24"
                  decoding="async"
                >
                <span class="track-detail-add-label" data-track-add-label>Add Track</span>
              </span>
            </button>
          </div>
          <div class="track-detail-divider" aria-hidden="true"></div>
          <div class="track-detail-side-col">
            <h2 class="track-detail-section-heading">This track can help you:</h2>
            <ul id="track-detail-helps" class="track-detail-bullets"></ul>
            <h2 class="track-detail-section-heading track-detail-section-heading--tight">Track Details</h2>
            <ul id="track-detail-facts" class="track-detail-bullets"></ul>
          </div>
        </div>
      </div>

      <div
        id="track-add-modal"
        class="track-add-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="track-add-modal-title"
        aria-describedby="track-add-modal-text"
        hidden
      >
        <div class="track-add-modal-backdrop" data-track-add-modal-close></div>
        <div class="track-add-modal-card">
          <p id="track-add-modal-title" class="track-add-modal-title">
            Track Added Successfully!
          </p>
          <p id="track-add-modal-text" class="track-add-modal-text">
            Would you like to start the track now?
          </p>
          <div class="track-add-modal-actions">
            <button
              type="button"
              class="track-add-modal-btn track-add-modal-btn--link"
              data-track-add-modal-close
            >
              No Thanks!
            </button>
            <button
              type="button"
              class="track-add-modal-btn track-add-modal-btn--primary"
              id="track-add-modal-confirm"
            >
              Yes! Take me to the track.
            </button>
          </div>
        </div>
      </div>

      <div
        id="track-bio-modal"
        class="track-bio-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="track-bio-modal-name"
        hidden
      >
        <div class="track-bio-modal-backdrop" data-track-bio-close></div>
        <div class="track-bio-modal-card">
          <button
            type="button"
            class="track-bio-modal-close"
            aria-label="Close full bio"
            data-track-bio-close
          >
            <span class="track-bio-modal-close-icon" aria-hidden="true"></span>
          </button>
          <div class="track-bio-modal-author-block">
            <img
              id="track-bio-modal-avatar"
              class="track-bio-modal-avatar"
              src=""
              alt=""
              width="60"
              height="60"
              decoding="async"
            >
            <div class="track-bio-modal-author-meta">
              <p id="track-bio-modal-name" class="track-bio-modal-name"></p>
              <p id="track-bio-modal-role" class="track-bio-modal-role"></p>
            </div>
          </div>
          <div id="track-bio-modal-content" class="track-bio-modal-content"></div>
        </div>
      </div>
    </div>
  </main>

  <div data-include="components/footer.html"></div>
  <script src="scripts/HTMLInclude.min.js"></script>
  <script src="scripts/tracks-data.js"></script>
  <script src="scripts/track-detail.js"></script>
  <script src="scripts/default.js"></script>
</body>
</html>
