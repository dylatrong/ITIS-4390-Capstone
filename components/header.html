<header class="site-header">
  <div class="nav-bar">
    <button
      type="button"
      class="nav-toggle"
      aria-expanded="false"
      aria-controls="primary-nav"
      aria-label="Open navigation menu"
    >
      <span class="nav-toggle-icon" aria-hidden="true"></span>
      <span class="sr-only">Menu</span>
    </button>

    <a class="nav-brand" href="index.html" aria-label="NewLeaf home">
      <img
        class="nav-logo-img"
        src="assets/icons/logo.svg"
        alt="NewLeaf"
        width="169"
        height="54"
        decoding="async"
      >
    </a>

    <nav class="nav-links" id="primary-nav" aria-label="Primary navigation">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="explore-tracks.html">Explore Tracks</a>
      <a class="nav-link" href="my-tracks.html">My Tracks</a>
    </nav>

    <div class="nav-account-wrap">
      <button
        type="button"
        class="nav-account"
        aria-expanded="false"
        aria-controls="account-menu"
        aria-haspopup="true"
        aria-label="Account menu"
      >
        <span class="nav-account-icon" aria-hidden="true"></span>
      </button>
    </div>
  </div>

  <div
    class="account-menu-backdrop"
    aria-hidden="true"
    tabindex="-1"
  ></div>

<button id="theme-toggle" class="nav-account" aria-label="Toggle Dark Mode" style="margin-right: 1rem;">
  🌓
</button>

  <div
    id="account-menu"
    class="account-menu"
    role="dialog"
    aria-modal="true"
    aria-labelledby="account-menu-name"
    aria-hidden="true"
    tabindex="-1"
  >
    <div class="account-menu-inner">
      <div class="account-menu-header">
        <img
          class="account-menu-avatar"
          src="assets/images/profile.png"
          alt=""
          width="56"
          height="56"
          decoding="async"
        >
        <h2 id="account-menu-name" class="account-menu-name">
          Jack Doughtery
        </h2>
        <button
          type="button"
          class="account-menu-close"
          aria-label="Close account menu"
        >
          <span class="account-menu-icon--close" aria-hidden="true"></span>
        </button>
      </div>

      <div class="account-menu-section account-menu-section--bordered">
        <a class="account-menu-item" href="#">
          Profile
          <span class="account-menu-chevron" aria-hidden="true"></span>
        </a>
        <a class="account-menu-item" href="my-tracks.html">
          My Tracks
          <span class="account-menu-chevron" aria-hidden="true"></span>

        <a class="account-menu-item" href="#">
