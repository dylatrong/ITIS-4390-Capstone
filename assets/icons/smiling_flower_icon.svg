<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Smiling flower icon">
  <g fill="#ffffff" stroke="#000000" stroke-width="2.25" stroke-linejoin="round">
    <ellipse cx="32" cy="9.5" rx="8" ry="6.5"/>
    <ellipse cx="45" cy="14.5" rx="8" ry="6.5" transform="rotate(38 45 14.5)"/>
